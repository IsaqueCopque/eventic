services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ufbaeventos
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/initdb/PopulaBanco.sql:/docker-entrypoint-initdb.d/02-populate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ufbaeventos
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DEBUG: ${DEBUG:-false}
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-secret}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_EMAIL: ${SENDGRID_EMAIL:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
  pgadmin_data: